[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facet"
# Read from facet/version.py, which calls itself the single source of truth
# and was not: this said 0.1.0 while the application said 0.3.0, so anything
# installed from the repository reported a version three releases old.
dynamic = ["version"]
description = "Coordination analysis of crystal structures and of MD glass models, cut by bond valence rather than by distance: an application and a Python library"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sami Soudani" }]
keywords = ["crystallography", "bond valence", "coordination number", "CIF"]

# Kept deliberately small. gemmi parses, spglib supplies symmetry, numpy and
# scipy do the arithmetic, PySide6 is the interface. pymatgen is NOT a hard
# dependency: it is imported lazily and only for the O'Keeffe-Brese parameter
# estimate and the comparison coordination-number definitions, both of which
# degrade gracefully when it is absent.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gemmi>=0.6",
    "spglib>=2.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
extra = ["pymatgen>=2024.1"]        # estimated parameters, comparison CN methods
report = ["pandas>=2.0", "matplotlib>=3.8", "openpyxl>=3.1"]   # openpyxl: the .xlsx exports
plot = ["matplotlib>=3.8"]          # the quick figures of facet.basicity
# what the suite needs: -n 4 --dist loadfile runs it on four workers
# (pytest-xdist), --timeout stops a test that waits on a window
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pytest-xdist>=3.5",
       "pytest-timeout>=2.3", "networkx>=3.0"]

[project.scripts]
# optical basicity without the window: facet-basicity composition "30Na2O-70SiO2"
facet-basicity = "facet.basicity.cli:main"

[project.gui-scripts]
facet = "facet.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "facet.version.__version__" }

[tool.setuptools.packages.find]
include = ["facet*"]

[tool.setuptools.package-data]
facet = ["data/*.csv", "data/*.json", "data/*.cif", "data/*.md",
         "data/examples/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pymatgen.*",
    "ignore::DeprecationWarning:spglib.*",
]
