[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facet"
# Read from facet/version.py, which calls itself the single source of truth
# and was not: this said 0.1.0 while the application said 0.3.0, so anything
# installed from the repository reported a version three releases old.
dynamic = ["version"]
description = "Coordination analysis from crystal structure files, cut by bond valence rather than by distance"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sami Soudani" }]
keywords = ["crystallography", "bond valence", "coordination number", "CIF"]

# Kept deliberately small. gemmi parses, spglib supplies symmetry, numpy and
# scipy do the arithmetic, PySide6 is the interface. pymatgen is NOT a hard
# dependency: it is imported lazily and only for the O'Keeffe-Brese parameter
# estimate and the comparison coordination-number definitions, both of which
# degrade gracefully when it is absent.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gemmi>=0.6",
    "spglib>=2.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
extra = ["pymatgen>=2024.1"]        # estimated parameters, comparison CN methods
report = ["pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.gui-scripts]
facet = "facet.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "facet.version.__version__" }

[tool.setuptools.packages.find]
include = ["facet*"]

[tool.setuptools.package-data]
facet = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pymatgen.*",
    "ignore::DeprecationWarning:spglib.*",
]
